conversations:
  - 'ventilacion.yaml'

plugins:
  - filters.py

prompts:
  - prompts.yaml

templates:
  - messages.yaml

strategies:
  problema:
    - say INI_ESCUCHA_ACTIVA
    - listen problema
  problemaCont:
    - llm clasificar_problema problema_response
    - say "Gracias por compartir esto conmigo 💙. Entiendo que lo que pasó fue que _{problema_response}_. Es comprensible que te sientas alterad@. "
  malestar:
    - say "Es importante para mi saber **¿qué tan fuerte es tu malestar en una escala del _1_ al _10_?**\n Escribe el número que más te represente, tomando en cuenta que el _1_ es un malestar muy bajo y el _10_ es uno muy alto."
    - listen malestar | .to_number | remember malestar
  malestarCont:
    - say "Gracias por compartir esto conmigo ❤️.\nRecuerda que estamos junt@s en esto. Entiendo que tu malestar es un _{malestar}_. Espero poder brindarte herramientas y estrategias que te sean de utilidad 😊."

script:
  - solve problema
  - solve problemaCont
  - solve malestar
  - solve malestarCont
  - solve ventilacion
