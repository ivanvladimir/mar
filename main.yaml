settings:
    _name_system: "Mar"
    _name_user:   "Usuari@"

conversations:
  - 'name.yaml'
  - 'opcionA.yaml'
  - 'completa.yaml'
  - 'ventilacion.yaml'
  - 'derivacion.yaml'
  - 'directorio.yaml'
  - 'psico_educacion.yaml'
  - 'escuchaActiva.yaml'
  - 'necesidadSi.yaml'
  - 'necesidadNo.yaml'
  - 'categorizacion.yaml'
  - 'respNo.yaml'
  - 'respSi.yaml'
  - 'eval.yaml'

plugins:
  - filters.py

templates:
    - messages.yaml

strategies:
  intro_menu:
    - say INTRO
    - say MENU
    - listen opcion | .to_number | set opcion

  main:
    - solve intro_menu
    - if opcion == 1 then solve completa
    - if opcion == 2 then solve ventilacion
    - if opcion == 3 then solve directorio
    - if opcion == 4 then solve psico_educacion
    - say "Regresa cuando gustes😊. Cuenta con Mar siempre que lo necesites, {name} ❤️🐶❤️."
      #- say "Antes de que nos despidamos, quiero felicitarte por todo lo que lograste durante nuestro tiempo junt@s ❤️☺️"
    - say "Cuídate mucho. Gracias por haber confiado en mi el día de hoy ❤️😄"
    - say "¿Quieres regresar al menu princial?"
    - listen loop | .yesno | set loop

script:
  - if not name then solve name
  - .value True | set loop
  - while loop then solve main
