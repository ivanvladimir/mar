conversations:
  - 'escuchaActiva.yaml'
  - 'ventilacion.yaml'

plugins:
  - filters.py

templates:
  - messages.yaml

strategies:
  saludo:
    - say GRACIAS_AYUDA

  sentirMal:
    - say PRIMERO
    - say "**¿Te gustaría platicarme qué te está generando malestar?**"
    - say 'Escribe Si o No'
    - listen sentirMal | .yesno | set sentirMal

script:
  - solve saludo
  - solve sentirMal
  - if sentirMal == True then solve escuchaActiva
  - if sentirMal == False then say "Entiendo, muy bien 😊."
  - if sentirMal == False then solve ventilacion
